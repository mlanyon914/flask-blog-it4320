<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %} {% endblock %} - FlaskBlog</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #24292e; background-color: #fafbfc; }
        nav { display: flex; justify-content: space-between; align-items: center; background: #24292e; padding: 1rem 1.5rem; border-radius: 6px; margin-bottom: 2rem; }
        nav a { color: #fff; text-decoration: none; font-weight: 600; margin-left: 1rem; }
        nav a.brand { margin-left: 0; font-size: 1.2rem; }
        .alert { background: #ffeef0; color: #cb2431; border: 1px solid #fdaeb7; padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
        .post { margin-bottom: 1.5rem; }
        .badge { font-size: 0.85rem; color: #586069; }
        .btn { background: #2ea44f; color: #fff; padding: 0.4rem 0.8rem; border-radius: 4px; text-decoration: none; border: none; cursor: pointer; display: inline-block; font-size: 0.9rem; font-weight: 600; }
        .btn-danger { background: #cb2431; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #d1d5da; border-radius: 4px; font-family: inherit; font-size: 1rem; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}" class="brand">FlaskBlog</a>
        <a href="{{ url_for('create') }}">New Post</a>
    </nav>
    <div class="container">
        {% for message in get_flashed_messages() %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
        {% block content %} {% endblock %}
    </div>
</body>
</html>
