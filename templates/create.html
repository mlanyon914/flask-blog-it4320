{% extends 'base.html' %}

{% block content %}
    <h1>{% block title %} Create a New Post {% endblock %}</h1>
    <form method="post">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" placeholder="Post title" value="{{ request.form['title'] }}">
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea name="content" id="content" placeholder="Post content" rows="8">{{ request.form['content'] }}</textarea>
        </div>
        <button type="submit" class="btn">Submit</button>
    </form>
{% endblock %}
