{% extends 'base.html' %}

{% block content %}
    <h1>{% block title %} Welcome to My Blog {% endblock %}</h1>
    <hr>
    {% for post in posts %}
        <div class="post">
            <a href="{{ url_for('post', post_id=post['id']) }}">
                <h2>{{ post['title'] }}</h2>
            </a>
            <span class="badge">{{ post['created'] }}</span>
            <div style="margin-top: 0.5rem;">
                <a href="{{ url_for('edit', id=post['id']) }}" class="btn">Edit Post</a>
            </div>
            <hr>
        </div>
    {% endfor %}
{% endblock %}
